<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinthia — Board Downloader</title>
<meta name="description" content="Free tool: paste a Pinterest board link and download it as a zip that keeps your sections as folders.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath fill='%23fff' d='M10 7h7.2c3.6 0 5.8 2 5.8 5.2s-2.2 5.3-5.8 5.3h-3.6V25H10zm3.6 3v4.5h3.2c1.7 0 2.6-.9 2.6-2.3s-.9-2.2-2.6-2.2z'/%3E%3C/svg%3E">
<style>
  :root { --bg: #fff; --ink: #000; --gray: #b0b0b0; --mid: #6b6b6b; --soft: #f2f2f2; --hair: 1px solid #000; --err: #d00; --c1: 300px; --gap: 40px; --pad: 24px; --cols: 5;
    /* type scale: s = small UI, m = bar and buttons, l = names, d = nav, in = input, h = headlines */
    /* three sizes: s = secondary (counts, captions, tools), m = primary (names, nav, input, buttons), h = titles */
    --fcw: 40px; --fch: 31px; --fs-s: 16px; --fs-m: 22px; --fs-h: clamp(32px, 5vw, 56px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 500 var(--fs-s)/1.3 "Helvetica Neue", Helvetica, Arial, ui-sans-serif, sans-serif; letter-spacing: -.012em; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  button { font: inherit; letter-spacing: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  svg.ar { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ONE grid for the whole page: a label column and a content column */
  .wrap { max-width: none; margin: 0 auto; padding: 0 var(--pad); }
  .g { display: grid; grid-template-columns: var(--c1) minmax(0, 1fr); column-gap: var(--gap); }
  .c1 { grid-column: 1; min-width: 0; } .c2 { grid-column: 2; min-width: 0; }
  .cap { color: var(--gray); font-weight: 700; font-size: var(--fs-s); letter-spacing: -.02em; }

  header { padding-top: 22px; align-items: center; }
  .logo { display: inline-block; background: var(--ink); color: #fff; font-weight: 700; font-size: var(--fs-m); letter-spacing: -.04em; line-height: 1; padding: 7px 12px 8px; }
  nav { display: flex; gap: 26px; font-weight: 700; font-size: var(--fs-m); letter-spacing: -.04em; line-height: 1; }
  nav button { color: var(--gray); transition: color .15s; }
  nav button.on, nav button:hover { color: var(--ink); }

  .burger { display: none; width: 40px; height: 40px; padding: 0; position: relative; }
  .burger span { position: absolute; left: 9px; right: 9px; height: 2px; background: var(--ink); transition: transform .2s, opacity .15s, top .2s; }
  .burger span:nth-child(1) { top: 14px; } .burger span:nth-child(2) { top: 19px; } .burger span:nth-child(3) { top: 24px; }
  .burger[aria-expanded="true"] span:nth-child(1) { top: 19px; transform: rotate(45deg); }
  .burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .burger[aria-expanded="true"] span:nth-child(3) { top: 19px; transform: rotate(-45deg); }

  .about { display: none; margin-top: 104px; }
  .about p { margin: 0; font-weight: 700; font-size: var(--fs-m); line-height: 1.2; letter-spacing: -.03em; max-width: 36em; }
  .about.on { display: block; }

  body.page-other .hero, body.page-other #cabinet, body.page-other #front { display: none !important; }
  .ext { margin-top: 104px; }
  .browser { margin-top: 34px; }
  .browser h3 { margin: 0 0 10px; font-weight: 700; font-size: var(--fs-m); letter-spacing: -.04em; line-height: 1.1; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { padding: 4px 0; color: var(--mid); font-weight: 500; font-size: var(--fs-s); }
  .steps b { color: var(--ink); font-weight: 700; }
  .steps .sep { width: .8em; height: .8em; vertical-align: -.05em; margin: 0 .15em; stroke-width: 2.4; color: var(--ink); }
  .steps code { font: 500 var(--fs-s) ui-monospace, "SF Mono", Menlo, monospace; background: var(--soft); padding: 1px 6px; color: var(--ink); }
  .steps .copy { color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; margin-left: 4px; }
  .thanks .btn { margin-top: 28px; text-decoration: none; }
  .dlext { text-decoration: none; }

  /* landing + link bar */
  .hero { padding: 104px 0 0; }
  body.loaded .hero { padding-top: 0; }
  body.loaded form { display: none; }
  h1 { font-weight: 700; font-size: var(--fs-h); line-height: 1.02; letter-spacing: -.045em; margin: 0 0 24px; }
  body.loaded h1, body.loaded .hero .c1 .cap.big { display: none; }
  form { display: flex; align-items: center; gap: 16px; border-bottom: var(--hair); padding-bottom: 8px; }
  form input { flex: 1; min-width: 0; border: 0; background: transparent; font: 700 var(--fs-m)/1.2 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -.035em; color: var(--ink); padding: 8px 0; outline: none; }
  form input:focus-visible { outline: none; }
  form input::placeholder { color: var(--gray); }
  form button { font-weight: 700; font-size: var(--fs-m); letter-spacing: -.035em; display: flex; align-items: center; gap: 10px; }
  form button svg { width: 22px; height: 22px; stroke-width: 1.6; }
  form button:disabled { color: var(--gray); cursor: default; }
  #note { min-height: 28px; margin-top: 12px; font-size: var(--fs-s); color: var(--gray); }
  #note.err { color: var(--err); }
  body.loaded #note:empty { display: none; }

  /* title block */
  #cabinet { display: none; } #cabinet.on { display: block; }
  .crumbs { padding: 124px 0 44px; }
  .crumbs h2 { margin: 0; font-weight: 700; font-size: var(--fs-h); line-height: 1.02; letter-spacing: -.045em; }
  .crumbs .meta { margin: 16px 0 0; font-weight: 700; font-size: var(--fs-m); letter-spacing: -.03em; color: var(--gray); }
  .tools { display: flex; gap: 26px; margin-top: 18px; font-weight: 700; font-size: var(--fs-s); flex-wrap: wrap; }
  .tools button { color: var(--gray); display: inline-flex; align-items: center; gap: 7px; } .tools button:hover { color: var(--ink); }

  /* rows: every row sits on the same two columns */
  .row { border-top: var(--hair); padding: 22px 0 64px; }
  .row.master { padding: 22px 0; }
  .lab { display: flex; align-items: flex-start; gap: 14px; }
  .row.d1 .lab { padding-left: 18px; }
  .row.d2 .lab { padding-left: 40px; }
  .lt { min-width: 0; }
  .nm { min-height: var(--fch); display: flex; align-items: center; font-weight: 700; font-size: var(--fs-m); line-height: 1.1; letter-spacing: -.04em; overflow-wrap: anywhere; }
  .ct:empty { display: none; }
  .ct { display: block; margin-top: 0; color: var(--gray); font-weight: 700; font-size: var(--fs-s); letter-spacing: -.02em; }
  .sub { color: var(--gray); font-weight: 700; font-size: var(--fs-s); padding-top: 5px; }

  /* folder icon = checkbox: hollow / half / full with check */
  .fcb { width: var(--fcw); height: var(--fch); flex: none; } /* the folder glyph is cropped to its own shape, so its top lines up with the pins */
  .fcb svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .fcb .b { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: miter; stroke-miterlimit: 10; shape-rendering: geometricPrecision; transition: fill .12s; }
  .fcb .k { fill: none; stroke: #fff; stroke-width: 1.5; stroke-linecap: square; stroke-linejoin: miter; opacity: 0; }
  .fcb[data-state="all"] .b { fill: var(--ink); }
  .fcb[data-state="all"] .k { opacity: 1; }
  .fcb:hover .b { fill: var(--ink); }
  .fcb:hover .k { opacity: 0; }

  /* row tools */
  .rh { display: flex; justify-content: flex-end; align-items: center; gap: 22px; margin-bottom: 4px; min-height: 31px; font-weight: 700; font-size: var(--fs-s); letter-spacing: -.02em; }
  .rh > button { color: var(--mid); display: inline-flex; align-items: center; justify-content: flex-end; gap: 6px; } .rh > button:hover { color: var(--ink); }
  .subl { margin-right: auto; color: var(--gray); }
  .rh > [data-viewall] { min-width: 96px; }
  .more { margin-top: 14px; font-weight: 700; font-size: var(--fs-s); letter-spacing: -.02em; }
  .more:empty { display: none; }
  .more > span { color: var(--gray); }
  .more em { font-style: normal; color: var(--gray); margin-left: 6px; }
  .more button { color: var(--mid); } .more button:hover { color: var(--ink); }

  /* horizontal strip of pins; "show all" only wraps it, tiles keep their size */
  /* a row of --cols tiles that always fills the width; "Show all" just lets it grow into more rows */
  .strip { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 6px; }
  .strip.one { grid-auto-rows: 0; row-gap: 0; overflow: hidden; } /* cover rows: extra covers fall into zero-height rows */
  .pin { position: relative; aspect-ratio: 3/4; background: var(--soft); padding: 0; overflow: hidden; }
  .pin img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s; }
  .pin:hover img { transform: scale(1.03); }
  .pin.cover { cursor: pointer; }
  .pin .kind { position: absolute; left: 6px; bottom: 6px; background: var(--ink); color: #fff; padding: 1px 7px; font-size: var(--fs-s); font-weight: 700; }
  .pin .chk { position: absolute; left: 6px; top: 6px; width: 20px; height: 20px; background: #fff; border: 1.5px solid var(--ink); display: grid; place-items: center; opacity: 0; transition: opacity .1s; }
  .pin:hover .chk { opacity: 1; }
  .pin .chk svg { width: 12px; height: 12px; opacity: 0; }
  .pin.sel .chk { opacity: 1; background: var(--ink); }
  .pin.sel .chk svg { opacity: 1; }
  .pin.dim img { opacity: .28; }
  .pin.dim .chk { opacity: 1; }
  .skeleton { aspect-ratio: 3/4; background: var(--soft); animation: pulse 1.2s infinite; }
  .end { grid-column: 1 / -1; height: 1px; }
  @keyframes pulse { 50% { opacity: .5; } }
  .empty { color: var(--gray); font-weight: 700; padding: 6px 0; }

  /* drawer front (bottom), same two columns */
  .front { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: none; background: var(--bg); border-top: 1px solid #dcdcdc; }
  .front.on { display: block; }
  .front-in { padding-top: 16px; padding-bottom: 18px; }
  .front .g { align-items: center; row-gap: 18px; }
  .sum { font-weight: 700; font-size: var(--fs-m); letter-spacing: -.03em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .sum em { font-style: normal; color: var(--gray); }
  .actions { display: flex; align-items: center; gap: 26px; }
  .actions .sp { flex: 1; }
  .dlmsg { color: var(--err); font-weight: 700; font-size: var(--fs-s); letter-spacing: -.02em; text-align: right; min-width: 0; }
  .fl { font-weight: 700; font-size: var(--fs-m); letter-spacing: -.02em; color: var(--mid); white-space: nowrap; }
  .fl:hover { color: var(--ink); }
  .opt-btn { font-weight: 700; font-size: var(--fs-m); letter-spacing: -.03em; color: var(--mid); display: inline-flex; align-items: center; gap: 8px; }
  .opt-btn svg { transition: transform .2s; }
  .opt-btn:hover, .front.optsopen .opt-btn { color: var(--ink); }
  .front.optsopen .opt-btn svg { transform: rotate(180deg); }
  .btn { background: var(--ink); color: #fff; padding: 13px 24px; font-weight: 700; font-size: var(--fs-m); letter-spacing: -.03em; white-space: nowrap; display: inline-flex; align-items: center; gap: 12px; max-width: 100%; }
  .btn svg { width: 22px; height: 22px; stroke-width: 1.7; }
  .btn:hover { background: #333; }
  .btn.alt { background: none; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); } .btn.alt:hover { background: var(--soft); }
  .btn:disabled { background: var(--gray); cursor: default; }

  /* options: start at the left edge, plenty of room */
  .opts-wrap { display: none; }
  .front.optsopen .opts-wrap { display: block; padding: 10px 0 34px; margin-bottom: 18px; border-bottom: 1px solid #e6e6e6; }
  .ogrid { row-gap: 26px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px 26px; }
  .o { font-weight: 700; font-size: var(--fs-s); letter-spacing: -.02em; color: var(--mid); }
  .o:hover { color: var(--ink); }
  .o.on { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px; }

  .prog { display: none; flex: 1; align-items: center; gap: 18px; }
  .front.busy .prog { display: flex; }
  .front.busy .sum, .front.busy .dlmsg, .front.busy .fl, .front.busy .opt-btn, .front.busy .btn, .front.busy .opts-wrap, .front.busy .sp { display: none !important; }
  .track { flex: 1; height: 6px; background: #ddd; overflow: hidden; }
  .track div { height: 100%; width: 0; background: var(--ink); transition: width .4s; }
  .track.indet div { width: 30% !important; animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  .stop { padding: 8px 20px; font-size: var(--fs-s); }
  .prog em { font-style: normal; color: var(--gray); margin-left: 6px; }
  .prog > span { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: var(--fs-m); letter-spacing: -.03em; white-space: nowrap; }
  main { padding-bottom: 240px; }

  /* tablet: same single label column, a little narrower */
  @media (max-width: 1100px) { :root { --cols: 4; --c1: 230px; --gap: 28px; --fcw: 34px; --fch: 26px; } }
  /* small tablet + phone: label on top, content full width */
  @media (max-width: 820px) {
    :root { --pad: 14px; --gap: 0px; --cols: 4; --fcw: 28px; --fch: 22px; }
    .g { grid-template-columns: 1fr; } .c2 { grid-column: 1; }
    header.g { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0; }
    .burger { display: block; margin-right: -9px; }
    nav { display: none; flex-basis: 100%; flex-direction: column; gap: 0; font-size: var(--fs-m); border-top: var(--hair); margin-top: 12px; }
    nav button { padding: 14px 0; border-bottom: 1px solid #e6e6e6; width: 100%; }
    header.open nav { display: flex; }
    .hero { padding-top: 64px; } .about, .ext { margin-top: 64px; }
    .crumbs { padding: 84px 0 28px; } .crumbs .c1 { display: none; }
    .row { padding: 20px 0 54px; } .row .c2 { margin-top: 14px; }
    .row.d1 .lab { padding-left: 12px; } .row.d2 .lab { padding-left: 24px; } .lab { gap: 10px; }
    .nm { font-size: 19px; }
    .row.master { padding: 20px 0; }
    .rh { justify-content: flex-start; min-height: 0; margin: 0; }
    .ogrid { row-gap: 18px; } .chips { gap: 6px 18px; }
    /* bottom bar: summary + Options on one line, links and the button on the next */
    .front-in { padding-top: 16px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
    .front.optsopen .opts-wrap { padding: 4px 0 24px; margin-bottom: 16px; }
    .front.optsopen { max-height: 80vh; overflow-y: auto; }
    .chips { gap: 14px 24px; } .o { padding: 6px 0; font-size: 17px; }
    .opt-btn { padding: 6px 0 6px 8px; }
    .front .btn { padding: 16px 20px; }
    .ogrid > .c2 { margin-top: 18px; }
    .front .g { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
    .front .c1, .front .actions { display: contents; }
    .sum { order: 1; flex: 1 1 calc(100% - 100px); font-size: var(--fs-s); white-space: normal; }
    .opt-btn { order: 2; font-size: var(--fs-s); }
    .fl { order: 3; font-size: var(--fs-s); }
    .actions .sp { display: none; }
    .dlmsg { order: 4; flex: 1 1 100%; text-align: left; }
    .front .btn { order: 5; flex: 1 1 100%; justify-content: center; }
    .prog { order: 6; flex: 1 1 100%; }
  }
  @media (max-width: 560px) {
    :root { --cols: 3; --fcw: 24px; --fch: 19px; }
    h1 { margin-bottom: 18px; }
  }
  /* touch: no hover, so the pin checkbox is always visible and easy to hit */
  @media (hover: none) {
    .pin .chk { opacity: 1; width: 26px; height: 26px; left: 5px; top: 5px; background: rgba(255,255,255,.9); }
    .pin .chk svg { width: 15px; height: 15px; }
    .pin:hover img { transform: none; }
    .pin.cover .chk { display: none; }
  }
  @media (max-width: 340px) { :root { --cols: 2; } }
</style>
</head>
<body>
<main class="wrap" id="main">
  <header class="g">
    <div class="c1"><button class="logo" id="logo" type="button" aria-label="Pinthia, start over">Pinthia</button></div>
    <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav"><span></span><span></span><span></span></button>
    <nav class="c2" id="nav" aria-label="Pages">
      <button class="on" id="navDl" type="button">Download</button>
      <button id="navExt" type="button">Add extension</button>
      <button id="navAbout" type="button">Thank</button>
    </nav>
  </header>

  <div class="g" id="extPanel" hidden>
    <div class="c1"></div>
    <div class="c2 ext">
      <a class="btn dlext" href="extension.zip" download>Download extension</a>
      <div id="extSteps"></div>
    </div>
  </div>

  <div class="g"><div class="c1"></div><div class="c2 about thanks" id="about"><p>Pinthia turns a public Pinterest board, section or profile into one download, keeping your sections as folders. It is free, and made by one person. If it saved you some time, a Pepsi is more than enough.</p><a class="btn" id="pepsi" href="https://ko-fi.com/jureeruj" target="_blank" rel="noopener">Buy me a Pepsi</a></div></div>

  <div class="hero g">
    <div class="c1"></div>
    <div class="c2">
      <h1>Paste a board link.<br>Get every pin, in folders.</h1>
      <form id="form">
        <input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="pinterest.com/…" aria-label="Pinterest link" autofocus>
        <button id="go" type="submit"></button>
      </form>
      <div id="note" role="status" aria-live="polite"></div>
    </div>
  </div>

  <section id="cabinet">
    <div class="crumbs g">
      <div class="c1"></div>
      <div class="c2">
        <h2 id="title"></h2>
        <p class="meta num" id="meta"></p>
        <div class="tools" id="tools">
          <button id="back" type="button" hidden></button>
        </div>
      </div>
    </div>
    <div id="tree"></div>
  </section>
</main>

<div class="front" id="front">
  <div class="front-in wrap">
    <div class="opts-wrap" id="opts"></div>
    <div class="g">
      <div class="c1"><button class="opt-btn" id="optBtn" type="button" aria-expanded="false"></button></div>
      <div class="c2 actions">
        <div class="sum num" id="sum"></div>
        <button class="fl" id="allOn" type="button" hidden>Select all</button>
        <button class="fl" id="allOff" type="button" hidden>Deselect all</button>
        <span class="sp"></span>
        <span class="dlmsg" id="dlmsg" role="alert" hidden></span>
        <button class="btn num" id="dl" type="button"></button>
        <div class="prog"><div class="track indet" id="track"><div></div></div><span class="num" id="nums">Starting…</span><button class="btn alt stop" id="stop" type="button" hidden>Stop</button></div>
      </div>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
